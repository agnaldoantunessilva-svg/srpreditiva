<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista Geral - Preditiva SR - Montenegro RS</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #070a13; 
    --panel: rgba(15, 23, 42, 0.75);
    --panel-border: rgba(56, 189, 248, 0.2);
    --txt: #e2e8f0;
    --muted: #8b9bb4;
    --cyan: #06b6d4;
    --green: #10b981;
    --amber: #f59e0b;
    --red: #ef4444;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter', 'Segoe UI', system-ui, sans-serif;
    background-color: var(--bg);
    background-image: 
      linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px),
      radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.08) 0%, transparent 60%);
    background-size: 40px 40px, 40px 40px, 100% 100%;
    color: var(--txt);
    line-height: 1.5;
    min-height: 100vh;
  }
  
  header{
    background:rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--panel-border);
    color:#fff; padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center;
    position:sticky; top:0; z-index:100; flex-wrap:wrap; gap:.5rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .header-left{display:flex;align-items:center;gap:1rem}
  .logo-box{background:#fff;padding:.3rem .6rem;border-radius:6px;display:flex;align-items:center;justify-content:center;}
  .logo-box img{height:24px;display:block;object-fit:contain}
  header h1{font-size:1.2rem; display:flex; align-items:center; gap:.5rem; font-weight: 700; letter-spacing: 0.05em;}
  header .badge{
    background:rgba(6, 182, 212, 0.15); color: var(--cyan);
    border: 1px solid rgba(6, 182, 212, 0.3);
    padding:.25rem .75rem; border-radius:4px; font-size:.75rem; font-family: var(--font-mono);
  }
  .header-right{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  #clock{
    font-family: var(--font-mono); font-size:.9rem; color: var(--cyan);
    background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 6px;
    border: 1px solid rgba(56, 189, 248, 0.15);
  }
  
  .btn-upload{
    background: rgba(6, 182, 212, 0.1); color: var(--cyan); border: 1px solid rgba(6, 182, 212, 0.3);
    padding:.55rem 1rem; border-radius:6px; cursor:pointer; font-weight:700; font-size:.85rem;
    font-family: var(--font-mono); transition:.2s; display:flex; align-items:center; gap:.4rem;
  }
  .btn-upload:hover{ background: rgba(6, 182, 212, 0.2); box-shadow: 0 0 15px rgba(6, 182, 212, 0.3); }
  
  .btn-print{ background: rgba(16, 185, 129, 0.1); color: #4ade80; border-color: rgba(16, 185, 129, 0.3); }
  .btn-print:hover{ background: rgba(16, 185, 129, 0.2); box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }

  input[type="file"]{display:none}

  #statusBar{
    padding:.75rem 2rem; font-size:.85rem; font-family: var(--font-mono); font-weight: 600;
    background: rgba(6, 182, 212, 0.1); color: var(--cyan);
    border-bottom: 1px solid var(--panel-border); display:none;
  }
  #statusBar.show{display:block}
  #statusBar.error { background: rgba(239, 68, 68, 0.1); color: #f87171; border-bottom-color: rgba(239, 68, 68, 0.3); }
  #statusBar.ok { background: rgba(16, 185, 129, 0.1); color: #4ade80; border-bottom-color: rgba(16, 185, 129, 0.3); }

  .global-legend{
    background: rgba(15, 23, 42, 0.6); border-bottom: 1px solid var(--panel-border);
    padding:.75rem 2rem; display:flex; flex-wrap:wrap; gap:1.5rem; font-size:.8rem; align-items:center;
  }
  .legend-group{display:flex; align-items:center; gap:.5rem}
  .legend-title{font-weight:700; color:var(--cyan); font-family: var(--font-mono); letter-spacing: 0.05em;}
  .legend-item{display:flex; align-items:center; gap:.25rem; color: var(--muted); font-family: var(--font-mono); font-size: 0.75rem;}

  #filtroUrlBar{
    display:none; padding:.75rem 2rem; font-size:.9rem; font-weight:600; font-family: var(--font-mono);
    background:rgba(6, 182, 212, 0.1); color:var(--cyan); border-bottom:1px solid var(--panel-border);
    align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.5rem;
  }
  #filtroUrlBar.show{display:flex}
  #filtroUrlBar .btn-clear{
    background:rgba(239, 68, 68, 0.1); color:#f87171; border:1px solid rgba(239, 68, 68, 0.3);
    padding:.35rem .85rem; border-radius:6px; cursor:pointer; font-weight:700; font-size:.8rem;
    font-family: var(--font-mono);
  }
  #filtroUrlBar .btn-clear:hover{background:rgba(239, 68, 68, 0.2)}

  main{padding:2rem;max-width:1800px;margin:0 auto}

  .toolbar{display:flex;gap:.75rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center}
  .toolbar input,.toolbar select{
    padding:.6rem .75rem; border:1px solid rgba(255, 255, 255, 0.1); border-radius:6px;
    font-size:.9rem; font-family: var(--font-mono); background: rgba(0,0,0,0.3); color: var(--txt);
    outline: none; transition: border-color 0.2s;
  }
  .toolbar input:focus,.toolbar select:focus{border-color: var(--cyan)}
  .toolbar input{flex:1;min-width:150px}
  .toolbar select option { background: #0f172a; }

  .contador-box {
    font-size: 0.9rem; font-weight: bold; color: var(--cyan);
    background: rgba(6, 182, 212, 0.1); padding: 0.5rem 1rem; border-radius: 6px;
    display: inline-block; margin-top: 1rem; margin-bottom: 1rem;
    border-left: 3px solid var(--cyan); font-family: var(--font-mono);
  }

  table.data{
    width:100%; border-collapse:collapse; background:var(--panel); border-radius:12px; overflow:hidden;
    border:1px solid var(--panel-border); box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    font-size:11px; table-layout: auto; font-family: var(--font-mono);
  }
  table.data thead{background:rgba(0,0,0,0.4); color:var(--cyan); border-bottom: 1px solid var(--panel-border);}
  table.data th{padding:.75rem .5rem;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em; white-space: nowrap; border: 1px solid rgba(255,255,255,0.05);}
  table.data td{padding:.65rem .5rem; vertical-align:top; white-space: normal; word-break: break-word; border: 1px solid rgba(255,255,255,0.05); color: var(--txt);}
  table.data tbody tr:hover{background:rgba(6, 182, 212, 0.05)}
  
  table.data th:not(.col-wide):not(.col-tag), table.data td:not(.col-wide):not(.col-tag) { white-space: nowrap; }
  table.data th.col-wide, table.data td.col-wide { min-width: 250px; width: 30%; white-space: normal; }
  table.data th.col-tag, table.data td.col-tag { min-width: 180px; width: 24%; white-space: normal; text-align: justify; }
  .hide-col { display: none !important; }

  /* Badges Técnicos */
  .status{
    display:inline-block; padding:.2rem .5rem; border-radius:4px; font-size:10px; font-weight:700; white-space:nowrap;
    font-family: var(--font-mono); border: 1px solid transparent;
  }
  .status.N  { background:rgba(16, 185, 129, 0.15); color:#34d399; border-color: rgba(16, 185, 129, 0.3); }
  .status.A1 { background:rgba(234, 179, 8, 0.15); color:#fbbf24; border-color: rgba(234, 179, 8, 0.3); }
  .status.A2 { background:rgba(249, 115, 22, 0.15); color:#fb923c; border-color: rgba(249, 115, 22, 0.3); }
  .status.A3 { background:rgba(239, 68, 68, 0.15); color:#f87171; border-color: rgba(239, 68, 68, 0.3); }
  .status.A4 { background:rgba(127, 29, 29, 0.5); color:#fca5a5; border-color: rgba(239, 68, 68, 0.5); }
  .status.P  { background:rgba(100, 116, 139, 0.15); color:#94a3b8; border-color: rgba(100, 116, 139, 0.3); }
  .status.M  { background:rgba(139, 92, 246, 0.15); color:#a78bfa; border-color: rgba(139, 92, 246, 0.3); }
  .status.NM { background:rgba(255, 255, 255, 0.05); color:#cbd5e1; border-color: rgba(255, 255, 255, 0.1); }

  @media(max-width:768px){
    main{padding:1rem} header{padding:.75rem 1rem}
    table.data{font-size:10px}
    .global-legend{padding:.5rem 1rem;gap:.75rem}
    header h1{display:none}
    .toolbar{flex-direction:column; align-items:stretch}
    .toolbar input{width:100%}
  }

  /* Impressão limpa em preto e branco */
  @media print {
    body { background: #fff; margin: 0; padding: 0; font-size: 10px; color: #000; font-family: sans-serif; }
    header, .toolbar, .contador-box, .btn-upload, .global-legend, #statusBar, #filtroUrlBar { display: none !important; }
    main { padding: 0; max-width: 100%; }
    h2 { display: none; }
    .hide-col { display: table-cell !important; }
    table.data { border-collapse: collapse; width: 100%; border: 1px solid #000; background: #fff; box-shadow: none; }
    table.data th, table.data td { border: 1px solid #000 !important; padding: 4px; color: #000; }
    table.data thead { background: #fff; color: #000; }
    table.data th { border-bottom: 2px solid #000 !important; }
    .status { border: 1px solid #000 !important; background: transparent !important; color: #000 !important; border-radius: 0; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-box"><img src="innova.png" alt="Innova" onerror="this.style.display='none'"></div>
    <div class="logo-box"><img src="sr.png" alt="SR Soluções" onerror="this.style.display='none'"></div>
    <h1>🔧 Preditiva SR <span class="badge">Montenegro RS</span></h1>
  </div>
  <div class="header-right">
    <div id="clock"></div>
    <button id="btnPrint" class="btn-upload btn-print">🖨️ Imprimir</button>
    <button id="btnReload" class="btn-upload">🔄 Atualizar</button>
    <input type="file"
