<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma Anual - Preditiva SR - Montenegro RS</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
  :root{--primary:#1e40af;--primary-dark:#1e3a8a;--bg:#f1f5f9;--card:#fff;--text:#1e293b;--border:#cbd5e1;--n:#16a34a;--a3:#ef4444;--p:#64748b;--a2:#f97316}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}

  header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:.75rem 2rem;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:.5rem}
  .header-left{display:flex;align-items:center;gap:1rem}
  header h1{font-size:1.15rem;display:flex;align-items:center;gap:.5rem;white-space:nowrap}
  header .badge{background:rgba(255,255,255,.2);padding:.25rem .75rem;border-radius:999px;font-size:.8rem}
  .header-right{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  #clock{font-variant-numeric:tabular-nums;font-size:.85rem;opacity:.9}
  
  /* Botão de atualizar manual removido */

  #statusBar{padding:.5rem 2rem;font-size:.85rem;background:#fef9c3;color:#854d0e;border-bottom:1px solid #fde047;display:none}
  #statusBar.show{display:block}

  main{padding:2rem;max-width:1600px;margin:0 auto;display:block !important;}

  .empty{text-align:center;padding:3rem 1rem;color:#94a3b8;background:var(--card);border-radius:12px;border:2px dashed var(--border)}

  .year-tabs{display:flex;gap:.5rem;margin-bottom:1rem;border-bottom:2px solid var(--border);padding-bottom:.5rem}
  .year-tabs button{background:transparent;border:none;font-size:1.2rem;font-weight:700;color:#94a3b8;cursor:pointer;padding:.5rem 1rem;border-radius:6px 6px 0 0;transition:.2s}
  .year-tabs button:hover{color:var(--primary);background:#e2e8f0}
  .year-tabs button.active{color:var(--primary);border-bottom:3px solid var(--primary);background:transparent}

  .month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:.5rem;margin-bottom:1.5rem}
  .month-btn{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:.6rem;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--text);transition:.2s}
  .month-btn:hover:not(.disabled){background:#e2e8f0;border-color:#94a3b8}
  .month-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 4px rgba(30,64,175,.3)}
  .month-btn.disabled{background:#f8fafc;color:#cbd5e1;border-color:#e2e8f0;cursor:not-allowed;box-shadow:none}

  .week-block{margin-bottom:1.5rem;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border);box-shadow:0 2px 6px rgba(0,0,0,.05)}
  .week-header{background:#e2e8f0;padding:.6rem 1rem;font-weight:bold;color:var(--primary-dark);display:flex;justify-content:space-between;align-items:center}
  .week-table{width:100%;border-collapse:collapse;font-size:.85rem}
  .week-table th{text-align:left;padding:.5rem 1rem;background:#f1f5f9;font-size:.75rem;color:#64748b;border-bottom:1px solid var(--border)}
  .week-table td{padding:.6rem 1rem;border-bottom:1px solid var(--border);vertical-align:middle}
  .week-table tr:last-child td{border-bottom:none}

  .status-ok{color:var(--n);font-weight:bold}
  .status-x{color:var(--a3);font-weight:bold}
  .status-readequado{color:var(--a2);font-weight:bold}
  .status-neutral{color:var(--p)}

  @media(max-width:768px){
    main{padding:1rem}header{padding:.75rem 1rem}
    header h1{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>🔧 Preditiva SR <span class="badge">Montenegro RS</span></h1>
  </div>
  <div class="header-right">
    <div id="clock"></div>
  </div>
</header>
<div id="statusBar"></div>

<main>
  <h2 style="margin-bottom:1rem">Cronograma Anual</h2>
  <div id="yearTabs" class="year-tabs"></div>
  <div id="monthGrid" class="month-grid"></div>
  <div id="cronoContent">
    <!-- Mensagem de carregamento inicial -->
    <div class="empty">⏳ Carregando dados do cronograma...</div>
  </div>
</main>

<script>
function tick(){const n=new Date();document.getElementById('clock').textContent=n.toLocaleDateString('pt-BR')+' '+n.toLocaleTimeString('pt-BR');}
setInterval(tick,1000);tick();

const DB = {
  cronograma: {},
  updatedAt: null,
};

let activeYear = new Date().getFullYear().toString();
let activeMonth = 'JAN';

const statusBar = document.getElementById('statusBar');

function setStatus(msg, tipo){
  statusBar.textContent = msg;
  statusBar.className = 'show';
  statusBar.style.background = tipo==='error'?'#fee2e2':tipo==='ok'?'#dcfce7':'#fef9c3';
  statusBar.style.color = tipo==='error'?'#991b1b':tipo==='ok'?'#166534':'#854d0e';
  statusBar.style.borderBottomColor = tipo==='error'?'#fca5a5':tipo==='ok'?'#86efac':'#fde047';
  if(tipo==='ok') setTimeout(()=>statusBar.classList.remove('show'), 5000);
}

function norm(s){ return (s||'').toString().replace(/[^A-Z0-9]/gi, '').toUpperCase(); }
function cleanText(s) { return s ? String(s).replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim() : ''; }

function parseWorkbookCrono(wb){
  DB.cronograma = {};
  const currentYearStr = new Date().getFullYear().toString();

  const MESES_MAP = {
    'JAN': 'JANEIRO', 'FEV': 'FEVEREIRO', 'MAR': 'MARÇO', 'ABR': 'ABRIL',
    'MAI': 'MAIO', 'JUN': 'JUNHO', 'JUL': 'JULHO', 'AGO': 'AGOSTO',
    'SET': 'SETEMBRO', 'OUT': 'OUTUBRO', 'NOV': 'NOVEMBRO', 'DEZ': 'DEZEMBRO'
  };

  if(!DB.cronograma[currentYearStr]) DB.cronograma[currentYearStr] = {};

  wb.SheetNames.forEach(nameRaw => {
    const sheetKey = norm(nameRaw);
    const mesCompleto = MESES_MAP[sheetKey];
    if(!mesCompleto) return;

    const ws = wb.Sheets[nameRaw];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', blankrows:false});

    let currentWeek = '';
    const items = [];

    rows.forEach(r => {
      if(!r || r.length === 0) return;

      const weekCell = r.find(c => typeof c === 'string' && c.toUpperCase().includes('SEMANA'));
      if(weekCell) {
        currentWeek = weekCell.trim();
        return;
      }

      if(r.includes('Dia') && r.includes('Local à ser Inspecionado')) return;

      let dt = null;
      let localStr = '';
      let statusStr = '';

      r.forEach((cell, idx) => {
        if(!cell) return;
        if(cell instanceof Date || /^\d{4}-\d{2}-\d{2}/.test(String(cell))) {
           const parsed = new Date(cell);
           if(!isNaN(parsed.getTime())) dt = parsed;
        }
      });

      if(dt) {
        const texts = r.filter(c => c && typeof c === 'string' && !c.match(/^\d{4}-\d{2}-\d{2}/));

        if(texts.length > 0) {
          const sortedTexts = texts.sort((a,b) => b.length - a.length);
          localStr = sortedTexts[0];
          if(sortedTexts.length > 1) {
            statusStr = r.filter(c => c && typeof c === 'string' && c !== localStr && !c.match(/^\d{4}-\d{2}-\d{2}/)).pop() || '';
          }
        }

        if(localStr && localStr.trim() !== '') {
          items.push({
            semana: currentWeek || 'Semana Geral',
            dia: dt.toLocaleDateString('pt-BR'),
            rawDate: dt,
            local: localStr.trim(),
            status: statusStr.trim()
          });
        }
      }
    });

    if(items.length > 0) {
      items.sort((a,b) => a.rawDate - b.rawDate);
      DB.cronograma[currentYearStr][mesCompleto] = items;
    }
  });

  DB.updatedAt = new Date().toISOString();
}

function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderCrono(){
  const yearTabs = document.getElementById('yearTabs');
  const monthGrid = document.getElementById('monthGrid');
  const content = document.getElementById('cronoContent');

  const years = Object.keys(DB.cronograma);

  if(!years.length) {
    yearTabs.innerHTML = '';
    monthGrid.innerHTML = '';
    content.innerHTML = '<div class="empty">Nenhum dado encontrado na planilha do GitHub.</div>';
    return;
  }

  yearTabs.innerHTML = years.map(y =>
    `<button class="${y === activeYear ? 'active' : ''}" onclick="setCronoYear('${y}')">${esc(y)}</button>`
  ).join('');

  const meses = ['JANEIRO', 'FEVEREIRO', 'MARÇO', 'ABRIL', 'MAIO', 'JUNHO', 'JULHO', 'AGOSTO', 'SETEMBRO', 'OUTUBRO', 'NOVEMBRO', 'DEZEMBRO'];
  const dadosAno = DB.cronograma[activeYear] || {};

  monthGrid.innerHTML = meses.map(m => {
    const temDados = !!dadosAno[m] && dadosAno[m].length > 0;
    const disabledClass = temDados ? '' : 'disabled';
    const activeClass = (m === activeMonth && temDados) ? 'active' : '';
    return `<button class="month-btn ${activeClass} ${disabledClass}"
      onclick="${temDados ? `setCronoMonth('${m}')` : ''}">
      ${m}
    </button>`;
  }).join('');

  const items = dadosAno[activeMonth] || [];
  if(!items.length) {
    content.innerHTML = `<div class="empty" style="margin-top:1rem">Sem atividades para ${activeMonth} de ${activeYear}.</div>`;
    return;
  }

  const weeks = {};
  items.forEach(item => {
    const sem = item.semana || 'Semana (Não especificada)';
    if(!weeks[sem]) weeks[sem] = [];
    weeks[sem].push(item);
  });

  let html = '';
  for(const [semName, weekItems] of Object.entries(weeks)) {
    html += `<div class="week-block">
      <div class="week-header">${esc(semName)}</div>
      <table class="week-table">
        <thead><tr><th>Dia</th><th>Local / Atividade</th><th>Status</th></tr></thead>
        <tbody>
          ${weekItems.map(i => {
            let stClass = 'status-neutral';
            let stLabel = i.status || '-';
            if(stLabel.toUpperCase() === 'OK') stClass = 'status-ok';
            else if(stLabel.toUpperCase() === 'X') stClass = 'status-x';
            else if(stLabel.toLowerCase().includes('readequado')) stClass = 'status-readequado';

            return `<tr>
              <td><strong>${esc(i.dia)}</strong></td>
              <td>${esc(i.local)}</td>
              <td class="${stClass}">${esc(stLabel)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
  }
  content.innerHTML = html;
}

window.setCronoYear = function(y) {
  activeYear = y;
  const meses = ['JANEIRO', 'FEVEREIRO', 'MARÇO', 'ABRIL', 'MAIO', 'JUNHO', 'JULHO', 'AGOSTO', 'SETEMBRO', 'OUTUBRO', 'NOVEMBRO', 'DEZEMBRO'];
  const dadosAno = DB.cronograma[y] || {};
  activeMonth = meses.find(m => dadosAno[m] && dadosAno[m].length > 0) || 'JANEIRO';
  renderCrono();
};

window.setCronoMonth = function(m) {
  activeMonth = m;
  renderCrono();
};

// FUNÇÃO QUE BUSCA A PLANILHA DO GITHUB E ATUALIZA A PÁGINA SOZINHA
async function carregarPlanilhaGitHub() {
  // IMPORTANTE: O nome aqui deve ser EXATAMENTE igual ao arquivo no GitHub
  const urlPlanilha = 'Cronograma Preditiva Innova.xlsx'; 
  
  setStatus('⏳ Buscando planilha no servidor...', 'info');

  try {
    // Adiciona um "?v=" com a data atual para forçar o navegador a baixar a versão mais nova e não usar o cache antigo
    const response = await fetch(urlPlanilha + '?v=' + new Date().getTime());
    
    if (!response.ok) throw new Error('Arquivo não encontrado no repositório');
    
    const arrayBuffer = await response.arrayBuffer();
    const wb = XLSX.read(arrayBuffer, {type:'array', cellDates:true});
    
    parseWorkbookCrono(wb);
    renderCrono();
    
    setStatus(`✅ Cronograma atualizado automaticamente do GitHub!`, 'ok');
  } catch (error) {
    console.error(error);
    setStatus('❌ Erro ao carregar a planilha do GitHub: ' + error.message, 'error');
    document.getElementById('cronoContent').innerHTML = '<div class="empty">Erro ao buscar a planilha.<br>Verifique se o arquivo existe no GitHub com o nome correto.</div>';
  }
}

// Inicia o carregamento assim que a página abrir
(function init(){
  carregarPlanilhaGitHub();
})();
</script>
</body>
</html>
