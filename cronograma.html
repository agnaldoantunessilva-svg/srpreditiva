<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma Anual - Preditiva SR - Montenegro RS</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #070a13; 
    --panel: rgba(15, 23, 42, 0.75);
    --panel-border: rgba(56, 189, 248, 0.2);
    --txt: #e2e8f0;
    --muted: #8b9bb4;
    --cyan: #06b6d4;
    --green: #10b981;
    --amber: #f59e0b;
    --red: #ef4444;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter', 'Segoe UI', system-ui, sans-serif;
    background-color: var(--bg);
    background-image: 
      linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px),
      radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.08) 0%, transparent 60%);
    background-size: 40px 40px, 40px 40px, 100% 100%;
    color: var(--txt);
    line-height: 1.5;
    min-height: 100vh;
  }

  header{
    background:rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--panel-border);
    color:#fff; padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center;
    position:sticky; top:0; z-index:100; flex-wrap:wrap; gap:.5rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .header-left{display:flex;align-items:center;gap:1rem}
  header h1{font-size:1.2rem; display:flex; align-items:center; gap:.5rem; font-weight: 700; letter-spacing: 0.05em;}
  header .badge{
    background:rgba(6, 182, 212, 0.15); color: var(--cyan);
    border: 1px solid rgba(6, 182, 212, 0.3);
    padding:.25rem .75rem; border-radius:4px; font-size:.75rem; font-family: var(--font-mono);
  }
  .header-right{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  #clock{
    font-family: var(--font-mono); font-size:.9rem; color: var(--cyan);
    background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 6px;
    border: 1px solid rgba(56, 189, 248, 0.15);
  }

  #statusBar{
    padding:.75rem 2rem; font-size:.85rem; font-family: var(--font-mono); font-weight: 600;
    background: rgba(6, 182, 212, 0.1); color: var(--cyan);
    border-bottom: 1px solid var(--panel-border); display:none;
  }
  #statusBar.show{display:block}
  #statusBar.error { background: rgba(239, 68, 68, 0.1); color: #f87171; border-bottom-color: rgba(239, 68, 68, 0.3); }
  #statusBar.ok { background: rgba(16, 185, 129, 0.1); color: #4ade80; border-bottom-color: rgba(16, 185, 129, 0.3); }

  main{padding:2rem;max-width:1600px;margin:0 auto;display:block !important;}

  .empty{
    text-align:center; padding:3rem 1rem; color:var(--muted); font-family: var(--font-mono);
    background:var(--panel); border-radius:12px; border:1px dashed var(--panel-border);
  }

  .year-tabs{
    display:flex; gap:.5rem; margin-bottom:1.5rem; 
    border-bottom:1px solid rgba(255, 255, 255, 0.1); padding-bottom:.5rem;
  }
  .year-tabs button{
    background:transparent; border:none; font-size:1.1rem; font-family: var(--font-mono);
    font-weight:700; color:var(--muted); cursor:pointer; padding:.5rem 1rem;
    border-radius:6px 6px 0 0; transition:.2s;
  }
  .year-tabs button:hover{color:var(--cyan); background:rgba(6, 182, 212, 0.1);}
  .year-tabs button.active{color:var(--cyan); border-bottom:2px solid var(--cyan); background:transparent;}

  .month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.75rem;margin-bottom:2rem}
  .month-btn{
    background:var(--panel); border:1px solid rgba(255, 255, 255, 0.08); border-radius:8px;
    padding:.75rem; font-weight:700; font-size:.85rem; font-family: var(--font-mono);
    cursor:pointer; color:var(--txt); transition:.2s;
  }
  .month-btn:hover:not(.disabled){
    background:rgba(6, 182, 212, 0.1); border-color:var(--cyan);
    transform: translateY(-2px); box-shadow: 0 4px 15px rgba(6, 182, 212, 0.2);
  }
  .month-btn.active{
    background:rgba(6, 182, 212, 0.2); color:var(--cyan); border-color:var(--cyan);
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
  }
  .month-btn.disabled{background:rgba(255,255,255,0.02);color:rgba(255,255,255,0.1);border-color:transparent;cursor:not-allowed;}

  .week-block{
    margin-bottom:1.5rem; background:var(--panel); border-radius:12px; overflow:hidden;
    border:1px solid var(--panel-border); box-shadow:0 4px 20px rgba(0,0,0,0.3);
  }
  .week-header{
    background:rgba(0,0,0,0.4); padding:.75rem 1.25rem; font-weight:bold; color:var(--cyan);
    font-family: var(--font-mono); border-bottom:1px solid var(--panel-border);
    display:flex; justify-content:space-between; align-items:center;
  }
  .week-table{width:100%;border-collapse:collapse;font-size:.85rem}
  .week-table th{
    text-align:left;padding:.75rem 1.25rem;background:rgba(255,255,255,0.03);
    font-size:.75rem;color:var(--muted);font-family: var(--font-mono);border-bottom:1px solid var(--panel-border);
  }
  .week-table td{padding:.75rem 1.25rem;border-bottom:1px solid rgba(255,255,255,0.05);vertical-align:middle;font-family: var(--font-mono);}
  .week-table tr:last-child td{border-bottom:none}
  .week-table tr:hover td { background: rgba(6, 182, 212, 0.05); }

  .status-ok{color:#4ade80;font-weight:bold;text-shadow: 0 0 10px rgba(74, 222, 128, 0.4);}
  .status-x{color:#f87171;font-weight:bold;text-shadow: 0 0 10px rgba(248, 113, 113, 0.4);}
  .status-readequado{color:#fbbf24;font-weight:bold;text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);}
  .status-neutral{color:var(--muted)}

  @media(max-width:768px){
    main{padding:1rem} header{padding:.75rem 1rem}
    header h1{display:none}
    .week-table th, .week-table td { padding: 0.5rem; font-size: 0.75rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>🔧 Preditiva SR <span class="badge">Montenegro RS</span></h1>
  </div>
  <div class="header-right">
    <div id="clock"></div>
  </div>
</header>
<div id="statusBar"></div>

<main>
  <h2 style="margin-bottom:1.5rem; font-family: var(--font-mono); font-size: 1.4rem;">Cronograma Anual</h2>
  <div id="yearTabs" class="year-tabs"></div>
  <div id="monthGrid" class="month-grid"></div>
  <div id="cronoContent">
    <div class="empty">⏳ [SYNC] Carregando dados do cronograma...</div>
  </div>
</main>

<script>
function tick(){const n=new Date();document.getElementById('clock').textContent=n.toLocaleDateString('pt-BR')+' '+n.toLocaleTimeString('pt-BR');}
setInterval(tick,1000);tick();

const DB = {
  cronograma: {},
  updatedAt: null,
};

let activeYear = new Date().getFullYear().toString();
let activeMonth = 'JAN';

const statusBar = document.getElementById('statusBar');

function setStatus(msg, tipo){
  statusBar.textContent = msg;
  statusBar.className = 'show ' + tipo;
  if(tipo==='ok') setTimeout(()=>statusBar.classList.remove('show'), 5000);
}

function norm(s){ return (s||'').toString().replace(/[^A-Z0-9]/gi, '').toUpperCase(); }
function cleanText(s) { return s ? String(s).replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim() : ''; }

function parseWorkbookCrono(wb){
  DB.cronograma = {};
  const currentYearStr = new Date().getFullYear().toString();

  const MESES_MAP = {
    'JAN': 'JANEIRO', 'FEV': 'FEVEREIRO', 'MAR': 'MARÇO', 'ABR': 'ABRIL',
    'MAI': 'MAIO', 'JUN': 'JUNHO', 'JUL': 'JULHO', 'AGO': 'AGOSTO',
    'SET': 'SETEMBRO', 'OUT': 'OUTUBRO', 'NOV': 'NOVEMBRO', 'DEZ': 'DEZEMBRO'
  };

  if(!DB.cronograma[currentYearStr]) DB.cronograma[currentYearStr] = {};

  wb.SheetNames.forEach(nameRaw => {
    const sheetKey = norm(nameRaw);
    const mesCompleto = MESES_MAP[sheetKey];
    if(!mesCompleto) return;

    const ws = wb.Sheets[nameRaw];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', blankrows:false});

    let currentWeek = '';
    const items = [];

    rows.forEach(r => {
      if(!r || r.length === 0) return;

      const weekCell = r.find(c => typeof c === 'string' && c.toUpperCase().includes('SEMANA'));
      if(weekCell) {
        currentWeek = weekCell.trim();
        return;
      }

      if(r.includes('Dia') && r.includes('Local à ser Inspecionado')) return;

      let dt = null;
      let localStr = '';
      let statusStr = '';

      r.forEach((cell, idx) => {
        if(!cell) return;
        if(cell instanceof Date || /^\d{4}-\d{2}-\d{2}/.test(String(cell))) {
           const parsed = new Date(cell);
           if(!isNaN(parsed.getTime())) dt = parsed;
        }
      });

      if(dt) {
        const texts = r.filter(c => c && typeof c === 'string' && !c.match(/^\d{4}-\d{2}-\d{2}/));

        if(texts.length > 0) {
          const sortedTexts = texts.sort((a,b) => b.length - a.length);
          localStr = sortedTexts[0];
          if(sortedTexts.length > 1) {
            statusStr = r.filter(c => c && typeof c === 'string' && c !== localStr && !c.match(/^\d{4}-\d{2}-\d{2}/)).pop() || '';
          }
        }

        if(localStr && localStr.trim() !== '') {
          items.push({
            semana: currentWeek || 'Semana Geral',
            dia: dt.toLocaleDateString('pt-BR'),
            rawDate: dt,
            local: localStr.trim(),
            status: statusStr.trim()
          });
        }
      }
    });

    if(items.length > 0) {
      items.sort((a,b) => a.rawDate - b.rawDate);
      DB.cronograma[currentYearStr][mesCompleto] = items;
    }
  });

  DB.updatedAt = new Date().toISOString();
}

function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderCrono(){
  const yearTabs = document.getElementById('yearTabs');
  const monthGrid = document.getElementById('monthGrid');
  const content = document.getElementById('cronoContent');

  const years = Object.keys(DB.cronograma);

  if(!years.length) {
    yearTabs.innerHTML = '';
    monthGrid.innerHTML = '';
    content.innerHTML = '<div class="empty">[ERR] Nenhum dado encontrado na planilha do GitHub.</div>';
    return;
  }

  yearTabs.innerHTML = years.map(y =>
    `<button class="${y === activeYear ? 'active' : ''}" onclick="setCronoYear('${y}')">${esc(y)}</button>`
  ).join('');

  const meses = ['JANEIRO', 'FEVEREIRO', 'MARÇO', 'ABRIL', 'MAIO', 'JUNHO', 'JULHO', 'AGOSTO', 'SETEMBRO', 'OUTUBRO', 'NOVEMBRO', 'DEZEMBRO'];
  const dadosAno = DB.cronograma[activeYear] || {};

  monthGrid.innerHTML = meses.map(m => {
    const temDados = !!dadosAno[m] && dadosAno[m].length > 0;
    const disabledClass = temDados ? '' : 'disabled';
    const activeClass = (m === activeMonth && temDados) ? 'active' : '';
    return `<button class="month-btn ${activeClass} ${disabledClass}"
      onclick="${temDados ? `setCronoMonth('${m}')` : ''}">
      ${m}
    </button>`;
  }).join('');

  const items = dadosAno[activeMonth] || [];
  if(!items.length) {
    content.innerHTML = `<div class="empty" style="margin-top:1rem">Sem atividades para ${activeMonth} de ${activeYear}.</div>`;
    return;
  }

  const weeks = {};
  items.forEach(item => {
    const sem = item.semana || 'Semana (Não especificada)';
    if(!weeks[sem]) weeks[sem] = [];
    weeks[sem].push(item);
  });

  let html = '';
  for(const [semName, weekItems] of Object.entries(weeks)) {
    html += `<div class="week-block">
      <div class="week-header">[${esc(semName).toUpperCase()}]</div>
      <table class="week-table">
        <thead><tr><th>DIA</th><th>LOCAL / ATIVIDADE</th><th>STATUS</th></tr></thead>
        <tbody>
          ${weekItems.map(i => {
            let stClass = 'status-neutral';
            let stLabel = i.status || '-';
            if(stLabel.toUpperCase() === 'OK') stClass = 'status-ok';
            else if(stLabel.toUpperCase() === 'X') stClass = 'status-x';
            else if(stLabel.toLowerCase().includes('readequado')) stClass = 'status-readequado';

            return `<tr>
              <td><strong>${esc(i.dia)}</strong></td>
              <td>${esc(i.local)}</td>
              <td class="${stClass}">${esc(stLabel)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
  }
  content.innerHTML = html;
}

window.setCronoYear = function(y) {
  activeYear = y;
  const meses = ['JANEIRO', 'FEVEREIRO', 'MARÇO', 'ABRIL', 'MAIO', 'JUNHO', 'JULHO', 'AGOSTO', 'SETEMBRO', 'OUTUBRO', 'NOVEMBRO', 'DEZEMBRO'];
  const dadosAno = DB.cronograma[y] || {};
  activeMonth = meses.find(m => dadosAno[m] && dadosAno[m].length > 0) || 'JANEIRO';
  renderCrono();
};

window.setCronoMonth = function(m) {
  activeMonth = m;
  renderCrono();
};

async function carregarPlanilhaGitHub() {
  const urlPlanilha = 'Cronograma Preditiva Innova.xlsx'; 
  
  setStatus('[SYNC] Buscando planilha no servidor...', '');

  try {
    const response = await fetch(urlPlanilha + '?v=' + new Date().getTime());
    
    if (!response.ok) throw new Error('Arquivo não encontrado no repositório');
    
    const arrayBuffer = await response.arrayBuffer();
    const wb = XLSX.read(arrayBuffer, {type:'array', cellDates:true});
    
    parseWorkbookCrono(wb);
    renderCrono();
    
    setStatus(`[OK] Cronograma atualizado automaticamente do GitHub!`, 'ok');
  } catch (error) {
    console.error(error);
    setStatus('[ERR] Falha ao carregar a planilha do GitHub: ' + error.message, 'error');
    document.getElementById('cronoContent').innerHTML = '<div class="empty">[ERR] Erro ao buscar a planilha.<br>Verifique se o arquivo existe no GitHub com o nome correto.</div>';
  }
}

(function init(){
  carregarPlanilhaGitHub();
})();
</script>
</body>
</html>
